title: Algorithmic Generative Art with Python
author: Xingyu Long
copyright: "2026"
logo: assets/site/logo.png
only_build_toc_files: true

execute:
  execute_notebooks: cache
  timeout: 300
  # notebooks may write into assets/outputs/ during execution
  allow_errors: false

launch_buttons:
  colab_url: "https://colab.research.google.com"
  notebook_interface: jupyterlab

repository:
  url: https://github.com/xysLong/generative-art-course
  branch: main

html:
  use_repository_button: true
  use_issues_button: false
  favicon: assets/site/favicon.png

sphinx:
  config:
    html_show_copyright: false
    nb_merge_streams: true
