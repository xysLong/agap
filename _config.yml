title: Algorithmic Generative Art with Python
author: <a href="https://kunstgeschichte.univie.ac.at/en/staff/academic-personnel/xingyu-long/">Xingyu Long</a>
copyright: "2026"
only_build_toc_files: true

execute:
  execute_notebooks: cache
  timeout: 300
  # notebooks may write into assets/outputs/ during execution
  allow_errors: false

html:
  favicon: assets/site/favicon.png
  use_repository_button: false
  use_issues_button: false
  use_edit_page_button: false

sphinx:
  config:
    html_show_copyright: false
    html_show_sphinx: false
    nb_merge_streams: true
    html_static_path: ["assets/site/static"]
    html_css_files: ["custom.css"]
    html_theme_options:
      use_download_button: false
      use_fullscreen_button: false
      show_navbar_depth: 1
      home_page_in_toc: true
