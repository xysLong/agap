name: deploy-book

on:
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "agap/**"
      - "assets/**"
      - "_config.yml"
      - "_toc.yml"
      - "intro.md"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt "jupyter-book>=1,<2"

      - name: Restore notebook execution cache
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jupyter-cache-${{ hashFiles('notebooks/**', 'agap/**') }}
          restore-keys: |
            jupyter-cache-

      - name: Fetch input images (not committed; falls back to synthetic)
        run: python assets/images/get_images.py

      - name: Build the book
        run: jupyter-book build .

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/html
